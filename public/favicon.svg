<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ink background with extra padding so the mark sits with breathing
       room inside platform-imposed rounded containers (Vercel project
       cards, browser tab favicons at large render sizes, app launchers).
       Inner content is wrapped in a transform that scales the mark to
       ~78% and recenters; the original 12-88 span becomes ~16-84. -->
  <rect width="100" height="100" fill="#1c1c16"/>
  <g transform="translate(11,11) scale(0.78)">
    <!-- Top-row lit cells (cream) with ink inner dot -->
    <rect x="12" y="12" width="22" height="22" fill="#fdf9f0" stroke="#fdf9f0" stroke-width="2"/>
    <rect x="20" y="20" width="6" height="6" fill="#1c1c16"/>
    <rect x="39" y="12" width="22" height="22" fill="#fdf9f0" stroke="#fdf9f0" stroke-width="2"/>
    <rect x="47" y="20" width="6" height="6" fill="#1c1c16"/>
    <rect x="66" y="12" width="22" height="22" fill="#fdf9f0" stroke="#fdf9f0" stroke-width="2"/>
    <rect x="74" y="20" width="6" height="6" fill="#1c1c16"/>

    <!-- Mid-left vermillion accent -->
    <rect x="12" y="39" width="22" height="22" fill="#ffb59a" stroke="#ffb59a" stroke-width="2"/>
    <rect x="20" y="47" width="6" height="6" fill="#1c1c16"/>

    <!-- Muted cells -->
    <g stroke="#fdf9f0" stroke-width="2" stroke-opacity="0.35" fill="none">
      <rect x="39" y="39" width="22" height="22"/>
      <rect x="66" y="39" width="22" height="22"/>
      <rect x="12" y="66" width="22" height="22"/>
      <rect x="39" y="66" width="22" height="22"/>
      <rect x="66" y="66" width="22" height="22"/>
    </g>
  </g>
</svg>
